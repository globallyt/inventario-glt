<style>
  :root{--blue:#0436C0;--orange:#FF6000;--bg:#F2F4F8;--ink:#101828;--mute:#667085;--line:#EAECF0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
  .wrap{max-width:520px;margin:0 auto;padding:16px}
  .card{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(16,24,40,.12);overflow:hidden}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:4px solid var(--orange)}
  .top img{height:42px;width:auto;max-width:60%}
  .top b{font-size:11px;color:var(--blue);letter-spacing:.8px;line-height:1.4;text-align:right}
  .body{padding:16px}
  .code{font-size:13px;color:var(--mute);font-weight:bold}
  h1{font-size:22px;margin:4px 0 10px;line-height:1.25}
  .badge{display:inline-block;color:#fff;font-size:13px;font-weight:bold;padding:4px 12px;border-radius:99px}
  table{width:100%;border-collapse:collapse;margin-top:14px}
  th{font-weight:normal;color:var(--mute);text-align:left;padding:9px 8px 9px 0;font-size:13px;width:42%;border-top:1px solid var(--line);vertical-align:top}
  td{padding:9px 0;font-size:14px;border-top:1px solid var(--line);word-break:break-word}
  .msg{padding:28px 16px;text-align:center;font-size:15px;line-height:1.5}
  .foot{font-size:11px;color:var(--mute);text-align:center;margin-top:12px}
  button{margin-top:12px;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer}
</style>

<script>
// Archivo CSV publicado de la pestaña "Publico" (solo columnas no sensibles).
var CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS5n_Y99tOhDVajxcFcQFSCWbFQN2KDK5bNydPfepX4qcKPUeuFX_oPP9denpdHQ04NdST4--VeLIHt/pub?gid=746410264&single=true&output=csv";

var CAMPOS = ['Categoría','Marca','Modelo','Número de serie','Sede','Área','Ubicación exacta',
              'Responsable actual','Condición física','Fecha de compra','Fin de garantía','Fecha de último inventario'];
var COLORES = {'Asignado':'#0A7D3B','Disponible':'#0436C0','En mantenimiento':'#B45309','En préstamo':'#B45309',
               'Dado de baja':'#B42318','Extraviado':'#B42318','Por inventariar':'#475467'};
var out = document.getElementById('out');

function parseCSV(t){
  var rows=[],row=[],f='',q=false,i,c;
  for(i=0;i<t.length;i++){
    c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c=='"') q=true;
    else if(c==','){ row.push(f); f=''; }
    else if(c=='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
    else if(c!='\r') f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function msg(text, retry){
  out.className='msg'; out.textContent=text;
  if(retry){ var b=document.createElement('button'); b.textContent='Reintentar'; b.onclick=load; out.appendChild(document.createElement('br')); out.appendChild(b); }
}
function show(rec){
  out.className='body'; out.textContent='';
  var d=document.createElement('div'); d.className='code'; d.textContent=rec['Código de inventario']; out.appendChild(d);
  var h=document.createElement('h1'); h.textContent=rec['Descripción / nombre del equipo']||rec['Categoría']||''; out.appendChild(h);
  var est=rec['Estado del activo'];
  if(est){ var s=document.createElement('span'); s.className='badge'; s.textContent=est; s.style.background=COLORES[est]||'#475467'; out.appendChild(s); }
  var t=document.createElement('table');
  CAMPOS.forEach(function(k){
    var v=(rec[k]||'').trim(); if(!v) return;
    var tr=document.createElement('tr'), th=document.createElement('th'), td=document.createElement('td');
    th.textContent=k; td.textContent=v; tr.appendChild(th); tr.appendChild(td); t.appendChild(tr);
  });
  out.appendChild(t);
}
function load(){
  var code=(new URLSearchParams(location.search).get('c')||'').trim();
  if(!code){ msg('Escanee el código QR de la etiqueta del activo.'); return; }
  msg('Cargando…');
  fetch(CSV_URL+(CSV_URL.indexOf('?')>-1?'&':'?')+'t='+Date.now())
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(txt){
      var rows=parseCSV(txt), head=rows[0]||[], found=null;
      for(var i=1;i<rows.length;i++){
        if((rows[i][0]||'').trim().toUpperCase()===code.toUpperCase()){
          found={}; head.forEach(function(k,j){ found[k.trim()]=rows[i][j]||''; }); break;
        }
      }
      if(found) show(found); else msg('El código '+code+' no existe en el inventario.');
    })
    .catch(function(){ msg('No se pudo cargar la ficha. Revise su conexión e intente de nuevo.', true); });
}
load();
</script>
